name: Build Android preview APK

on:
  push:
    branches: [main]
    paths:
      - apps/mobile/**
      - packages/api-client/**
      - packages/domain/**
      - packages/i18n/**
      - packages/typescript-config/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - .github/workflows/android-preview.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build internal Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@22.13.0
          cache: true
          install: false

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build preview APK
        working-directory: apps/mobile
        run: eas build --platform android --profile preview --non-interactive

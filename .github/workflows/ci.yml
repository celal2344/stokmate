name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: API, contracts, and clients
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      EXPO_NO_TELEMETRY: "1"
      STOKMATE_API_BASE_URL: http://127.0.0.1:5080

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack and pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate
          pnpm --version

      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore and build API
        run: |
          dotnet restore api/StokMate.sln
          dotnet build api/StokMate.sln --configuration Release --no-restore

      - name: Start API and run integration validation
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project api/src/StokMate.Api/StokMate.Api.csproj --configuration Release --no-build --urls "$STOKMATE_API_BASE_URL" > api.log 2>&1 &
          api_pid=$!
          cleanup() {
            kill "$api_pid" 2>/dev/null || true
            wait "$api_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error "$STOKMATE_API_BASE_URL/swagger/v1/swagger.json" > /dev/null; then
              break
            fi
            if [[ "$attempt" == 30 ]]; then
              cat api.log
              echo "API readiness check timed out after 30 seconds." >&2
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent --show-error "$STOKMATE_API_BASE_URL/swagger/v1/swagger.json" > packages/api-client/openapi/stokmate.openapi.json
          pnpm smoke:api
          pnpm smoke:contract
          pnpm smoke:contract

      - name: Validate shared packages and generated client
        run: |
          pnpm --filter @stokmate/api-client build
          pnpm --filter @stokmate/api-client typecheck
          pnpm --filter @stokmate/api-client lint
          pnpm --filter @stokmate/domain build
          pnpm --filter @stokmate/domain typecheck
          pnpm --filter @stokmate/domain lint
          pnpm --filter @stokmate/i18n build
          pnpm --filter @stokmate/i18n typecheck
          pnpm --filter @stokmate/i18n lint

      - name: Validate web client
        run: |
          pnpm exec prettier --check apps/web
          pnpm --filter @stokmate/web check:translations
          pnpm --filter @stokmate/web typecheck
          pnpm --filter @stokmate/web lint
          pnpm --filter @stokmate/web build

      - name: Validate mobile client
        run: |
          pnpm --filter @stokmate/mobile typecheck
          pnpm --filter @stokmate/mobile lint
          pnpm --filter @stokmate/mobile exec expo config --type public
          pnpm --filter @stokmate/mobile exec expo export --platform web --output-dir dist --max-workers 1

      - name: Verify generated and checked artifacts are committed
        run: |
          git diff --check
          git diff --exit-code
